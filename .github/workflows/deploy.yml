name: CI/CD Pipeline - Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy via Docker on VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          rm: false
          target: "~/uniquely-website"
          source: "."

      - name: Deploy & Restart Docker Container on VPS (Port 3005)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/uniquely-website
            echo "Building and launching Docker container on port 3005..."
            docker compose down || true
            docker compose up -d --build
            docker image prune -f
            echo "Deployment successful! App is live on port 3005."
