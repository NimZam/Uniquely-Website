name: CI/CD Pipeline - Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy via Docker on VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          rm: false
          target: "~/uniquely-website"
          source: "."

      - name: Deploy & Restart Docker Container on VPS (Port 3005)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/uniquely-website
            cd ~/uniquely-website
            echo "Building and launching Docker container on port 3005..."
            
            if command -v docker-compose &> /dev/null; then
              echo "Using docker-compose V1..."
              docker-compose down --remove-orphans || true
              docker-compose up -d --build
            elif docker compose version &> /dev/null; then
              echo "Using docker compose V2..."
              docker compose down --remove-orphans || true
              docker compose up -d --build
            else
              echo "Using docker run fallback..."
              docker stop uniquely-website-app || true
              docker rm uniquely-website-app || true
              docker build -t uniquely-website:latest .
              docker run -d --name uniquely-website-app --restart unless-stopped -p 3005:3000 uniquely-website:latest
            fi

            docker image prune -f
            echo "=== CURRENT RUNNING DOCKER CONTAINERS ==="
            docker ps
            echo "Deployment successful! Container is running."
